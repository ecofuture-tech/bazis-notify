name: Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  # started by the Release workflow on the tag it creates: a tag pushed with the
  # workflow token does not trigger the push event above
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ecofuture-tech/.github/.github/workflows/reusable-build-publish.yml@main
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}