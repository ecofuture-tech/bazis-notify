name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check bazis tests sample

  tests:
    name: tests (python ${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        resolution: [highest]
        include:
          # the lowest versions allowed by pyproject.toml
          - python: '3.12'
            resolution: lowest-direct

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BS_DEBUG: 'true'
      BS_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
      BS_DATABASES__DEFAULT__HOST: localhost
      BS_DATABASES__DEFAULT__PORT: '5432'
      BS_DATABASES__DEFAULT__NAME: bazis
      BS_DATABASES__DEFAULT__USER: postgres
      BS_DATABASES__DEFAULT__PASSWORD: postgres
      BS_CACHES__DEFAULT__LOCATION: redis://localhost:6379/1
      BS_MEDIA_ROOT: /tmp/bazis/media
      BS_STATIC_ROOT: /tmp/bazis/static
      BS_WEBAPP_ROOT: /tmp/bazis/webapp
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL (required by the PostGIS database backend)
        # a stalled Ubuntu mirror must fail the step quickly instead of hanging the job
        timeout-minutes: 10
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $APT update
          $APT install -y --no-install-recommends gdal-bin

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install --resolution ${{ matrix.resolution }} -e '.[test]'

      - name: Check for missing migrations
        working-directory: sample
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: sample
        run: python -m pytest ../tests -o addopts="" -p no:cacheprovider
