# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-notify"
summary = "stored notifications of the users: an inbox API, live delivery over bazis-ws, e-mail"
solves = [
    "notify users so that they see it later (stored per recipient, unread until read)",
    "an inbox for the client: list the own notifications, unread count, read/unread, delete, read all, clear",
    "notification texts in the language of each recipient",
    "deliver new notifications live to the open sessions (with bazis-ws)",
    "send a notification by e-mail through the mail backend of the core (BAZIS_EMAIL_*)",
    "notify every user (a fan-out in batches from a background task), idempotently by a deduplication key",
    "keep the notifications for a limited time (retention)",
]
requires = ["bazis", "bazis-users"]
pairs_well = ["bazis-ws", "bazis-bg"]

[[extension_points]]
name = "notify"
import = "bazis.contrib.notify.service.notify"
use_when = "create the notifications of users after a write: notify(users, 'app.type', _('Title %(x)s'), params=..., dedupe_key=..., email=False)"

[[extension_points]]
name = "notify_all"
import = "bazis.contrib.notify.service.notify_all"
use_when = "notify many users in batches, from a task of bazis-bg, with a dedupe_key"

[[extension_points]]
name = "register"
import = "bazis.contrib.notify.registry.register"
use_when = "declare a notification type in <app>/notifications.py"

[[extension_points]]
name = "router"
import = "bazis.contrib.notify.router.router"
use_when = "the API of the notifications of the user: router.register('bazis.contrib.notify.router')"

[[extension_points]]
name = "NotificationRouteSet"
import = "bazis.contrib.notify.routes.NotificationRouteSet"
use_when = "subclass it (default_route = True) to add fields or actions to the notifications API"

[[extension_points]]
name = "Notification"
import = "bazis.contrib.notify.models.Notification"
use_when = "query the notifications in the code; create them only with notify"

[[extension_points]]
name = "read_all"
import = "bazis.contrib.notify.service.read_all"
use_when = "mark every notification of a user read from the code"

[[extension_points]]
name = "delete_expired"
import = "bazis.contrib.notify.service.delete_expired"
use_when = "delete the notifications older than BAZIS_NOTIFY_RETENTION_DAYS, from a periodic task"

[[pitfalls]]
text = "notify refuses a type that is not registered: declare the types in <app>/notifications.py"

[[pitfalls]]
text = "a lazy string formatted before notify is translated in the language of the request: pass the template and params="

[[pitfalls]]
text = "notify inside a transaction delivers only after the commit"

[[pitfalls]]
text = "a dedupe_key deduplicates only while the notification with it exists"

[[pitfalls]]
text = "metadata is shown to the user: never put private data there"

[[pitfalls]]
text = "the e-mails are sent in the process of the write: notify many users from a background task (notify_all)"

[[pitfalls]]
text = "bazis.contrib.ws.messages.notify is a live message only; use notify of bazis-notify for what the user must see later"
